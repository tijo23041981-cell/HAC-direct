name: Mise à jour HAC
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hac-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer actus et scores
        run: python scripts/update.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Publier les changements
        run: |
          git config user.name "hac-bot"
          git config user.email "hac-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour des données" && git push)
