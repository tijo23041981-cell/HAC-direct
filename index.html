<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>HAC Direct</title>
<style>
:root{--bg:#eef6fc;--card:#fff;--tx:#0b2a4a;--mu:#5b7189;--ciel:#6cb4e4;--mar:#0b2a4a;--bd:#d3e3f1;--hl:#dff0fb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#07121f;--card:#0f2036;--tx:#e8f1fa;--mu:#8fa6bd;--bd:#1e3652;--hl:#16385a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:linear-gradient(135deg,var(--mar),#12558f 70%,var(--ciel));color:#fff;padding:calc(16px + env(safe-area-inset-top,0)) 16px 18px}
header h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}header img{width:40px;height:48px}
#st{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:99px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
nav button,.chips button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;white-space:nowrap;cursor:pointer}
nav button.on,.chips button.on{background:var(--mar);color:#fff;border-color:var(--mar);font-weight:700}
@media (prefers-color-scheme:dark){nav button.on,.chips button.on{background:var(--ciel);color:#07121f;border-color:var(--ciel)}}
main{max-width:680px;margin:0 auto;padding:6px 14px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(11,42,74,.08)}
h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{padding:4px 12px;font-size:13px}
.it{padding:10px 0;border-top:1px solid var(--bd)}.it:first-child{border-top:0;padding-top:0}
.it a{color:var(--tx);text-decoration:none;font-weight:600;line-height:1.3}.sm{font-size:13px;color:var(--mu)}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--hl);border-radius:6px;padding:1px 7px;margin-right:6px}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.r:first-of-type{border-top:0}.r .m{flex:1}
.b{width:22px;height:22px;border-radius:6px;color:#fff;font:700 12px/22px system-ui;text-align:center}.V{background:#16a34a}.N{background:#d97706}.D{background:#dc2626}
.live{border-color:#dc2626;text-align:center}.live .big{font-size:26px;font-weight:800}.cd{font-size:24px;font-weight:800;color:var(--ciel)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:5px 4px;text-align:center}th{color:var(--mu);font-size:12px}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{background:var(--hl);font-weight:700}
[hidden]{display:none!important}
</style></head><body>
<header><h1><img src="logo.svg" alt="Blason du HAC">HAC Direct</h1><span id="st">Connexion…</span></header>
<nav id="tabs"><button data-t="actus" class="on">📰 Actus</button><button data-t="matchs">⚽ Matchs</button><button data-t="classement">🏆 Classement</button></nav>
<main>
<section id="live" class="card live" hidden></section>
<section id="p-actus"><div class="card"><h2>Actualités du HAC</h2><div class="chips" id="chips"></div><div id="news"><div class="sm">Chargement…</div></div></div></section>
<section id="p-matchs" hidden><div class="card"><h2>Prochain match</h2><div id="next" class="sm">–</div></div><div class="card"><h2>Résultats</h2><div id="res"></div></div><div class="card"><h2>Calendrier</h2><div id="fix"></div></div></section>
<section id="p-classement" hidden><div class="card"><h2>Classement de Ligue 1</h2><table><thead><tr><th>#</th><th>Équipe</th><th>Pts</th><th>J</th><th>Diff</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const S={n:null,s:null,src:"Tous",last:0};
const rel=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);if(m<1)return"à l’instant";if(m<60)return"il y a "+m+" min";const h=Math.round(m/60);if(h<24)return"il y a "+h+" h";return"il y a "+Math.round(h/24)+" j"};
const fd=t=>new Date(t).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
async function j(u){try{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
async function load(){const[n,s]=await Promise.all([j("data/news.json"),j("data/scores.json")]);if(n)S.n=n;if(s)S.s=s;if(n||s)S.last=Date.now();render()}
function row(mid,right,badge){const d=el("div","r");if(badge)d.appendChild(el("span","b "+badge,badge));d.appendChild(el("span","m",mid));d.appendChild(el("span","sm",right));return d}
function render(){
 const items=(S.n&&S.n.items)||[],box=$("news");box.innerHTML="";
 const srcs=["Tous",...new Set(items.map(i=>i.source))],ch=$("chips");ch.innerHTML="";
 srcs.forEach(s=>{const b=el("button",s==S.src?"on":"",s);b.onclick=()=>{S.src=s;render()};ch.appendChild(b)});
 const list=items.filter(i=>S.src=="Tous"||i.source==S.src);
 if(!list.length)box.appendChild(el("div","sm","Aucune actualité pour l’instant. Le robot de mise à jour n’a peut-être pas encore tourné."));
 list.forEach(i=>{const d=el("div","it"),a=el("a",null,i.title);a.href=i.url;a.target="_blank";a.rel="noopener";const m=el("div","sm");m.append(el("span","tag",rel(i.date)),document.createTextNode(i.source));d.append(a,m);box.appendChild(d)});
 const s=S.s||{};const lv=$("live");
 if(s.live){lv.hidden=false;lv.innerHTML="";lv.append(el("div","sm","🔴 EN DIRECT"),el("div","big",s.live.home+" "+(s.live.hs??0)+" – "+(s.live.as??0)+" "+s.live.away))}else lv.hidden=true;
 const nx=(s.fixtures||[])[0];$("next").innerHTML="";
 if(nx){$("next").append(el("div","",nx.home+" – "+nx.away),el("div","sm",fd(nx.date)),el("div","cd",cd(nx.date)))}else $("next").textContent="Aucun match programmé.";
 const res=$("res");res.innerHTML="";(s.results||[]).slice().reverse().forEach(r=>{const g=r.hacHome?r.hs:r.as,c=r.hacHome?r.as:r.hs;res.appendChild(row(r.home+" – "+r.away,r.hs+" – "+r.as,g>c?"V":g==c?"N":"D"))});
 const fx=$("fix");fx.innerHTML="";(s.fixtures||[]).forEach(r=>fx.appendChild(row(r.home+" – "+r.away,fd(r.date))));
 const tb=$("tb");tb.innerHTML="";(s.table||[]).forEach(r=>{const tr=el("tr",r.hac?"me":"");[r.pos,r.team,r.pts,r.p,(r.gf-r.ga>0?"+":"")+(r.gf-r.ga)].forEach(v=>tr.appendChild(el("td",null,v)));tb.appendChild(tr)});
 status()}
function cd(t){const m=Math.max(0,Math.floor((new Date(t)-Date.now())/6e4)),j=Math.floor(m/1440),h=Math.floor(m%1440/60);return(j?j+" j ":"")+h+" h "+String(m%60).padStart(2,"0")+" min"}
function status(){$("st").textContent=!navigator.onLine?"🔴 Hors ligne":S.last?"🟢 En direct · synchro il y a "+Math.round((Date.now()-S.last)/1000)+" s":"Connexion…"}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));["actus","matchs","classement"].forEach(t=>$("p-"+t).hidden=t!=b.dataset.t)});
load();setInterval(load,60000);setInterval(status,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});addEventListener("online",load);
</script></body></html>
